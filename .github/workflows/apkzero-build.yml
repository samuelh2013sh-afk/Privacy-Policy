name: APKZero Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: apk or aab'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      module:
        description: 'Module to build'
        required: false
        default: 'app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured. Go to Settings → Secrets and variables → Actions to add it."
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not configured."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is not configured."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is not configured."
            exit 1
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          if [ ! -s keystore.jks ]; then
            echo "::error::Decoded keystore is empty. Check that KEYSTORE_BASE64 is a valid base64-encoded keystore file."
            exit 1
          fi

      - name: Build APK
        if: inputs.build_type == 'apk'
        run: |
          ./gradlew ${{ inputs.module }}:assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build AAB
        if: inputs.build_type == 'aab'
        run: |
          ./gradlew ${{ inputs.module }}:bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        if: inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ inputs.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            ${{ inputs.module }}/build/outputs/bundle/release/*.aab
          if-no-files-found: error