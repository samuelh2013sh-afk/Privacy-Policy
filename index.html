<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Privacy Policy / Política de Privacidade</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      width: 92%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
    }

    .logo {
      font-size: 52px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #0d1b2a;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #5c677d;
      margin-bottom: 36px;
    }

    .lang-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      min-width: 190px;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }

    .btn-pt {
      background: #009c3b;
      color: #fff;
    }

    .btn-en {
      background: #002868;
      color: #fff;
    }

    .flag { font-size: 1.3rem; }

    footer {
      margin-top: 36px;
      font-size: 0.8rem;
      color: #9aa5b4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>Privacy Policy</h1>
    <p class="subtitle">Select your language / Selecione seu idioma</p>

    <div class="lang-buttons">
      <a href="pt/" class="btn btn-pt">
        <span class="flag">🇧🇷</span> Português
      </a>
      <a href="en/" class="btn btn-en">
        <span class="flag">🇺🇸</span> English
      </a>
    </div>

    <footer>
      &copy; <span id="yr"></span> Samuel H. — All rights reserved.
    </footer>
  </div>

  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
